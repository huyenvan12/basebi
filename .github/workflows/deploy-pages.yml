name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://basebi.net
    steps:
      - name: Checkout
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/checkout@v6
          attempt_limit: 3
          attempt_delay: 15000

      - name: Configure Pages
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/configure-pages@v6
          attempt_limit: 3
          attempt_delay: 15000

      # Publish ONLY the files the app needs. Everything else in the repo (docs, mockups,
      # android, scripts, …) must never become a public URL on basebi.net.
      # 404.html = index.html is the SPA fallback (GitHub Pages has no rewrite rules, so a
      # hard refresh on /delivery-tracker would 404; js/router.js reads location.pathname).
      - name: Build site folder (allowlist)
        run: |
          mkdir -p _site
          cp -r index.html basebi.css js favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png CNAME _redirects _site/
          cp index.html _site/404.html
          ls -R _site | head -50

      # Not wretry-wrapped: upload-pages-artifact is a composite action, and
      # wretry.action can only wrap JS/docker actions ("Runner 'composite'
      # does not implemented"). It's a fast local archiving step, so the
      # transient-network risk it would guard against is low.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: actions/deploy-pages@v5
          attempt_limit: 3
          attempt_delay: 15000
